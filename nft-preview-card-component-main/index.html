<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NFT preview card component</title>
    <link rel="shortcut icon" href="images/favicon-32x32.png" type="image/x-icon">
    <link rel="stylesheet" href="styles/style.css">
</head>
<body>
    <main>
        <div class="nft-card-image">
            <img src="images/image-equilibrium.jpg" alt="Equilibrium">
        </div>
        <div class="nft-card-content">
            <h1>Equilibrium #3429</h1>
            <p>Our Equilibrium collection promotes balance and calm.</p>
            <div class="nft-card-details">
                <div class="nft-card-price">
                    <img src="images/icon-ethereum.svg" alt="Ethereum Icon">
                    <span>0.041 ETH</span>
                </div>
                <div class="nft-card-time">
                    <img src="images/icon-clock.svg" alt="Clock Icon">
                    <span>3 days left</span>
                </div>
                <footer class="nft-card-author-image">
                        <img src="images/image-avatar.png" alt="Avatar of Jules Wyvern">
                    <p>Creation of <span>Jules Wyvern</span></p>
                </footer>
        </div>
    </main>
</body>
</html>
